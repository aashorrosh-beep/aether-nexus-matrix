name: Nexus Quad-Brain Automated Sync

on:
  schedule:
    # 17:00 UTC = 12:00 PM Central | 03:00 UTC = 10:00 PM Central
    - cron: '0 17,3 * * *'
  workflow_dispatch: # Allows you to manually click a "Run" button if you ever want to force it early

jobs:
  execute-matrix-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Storefront Code
        uses: actions/checkout@v3

      - name: Boot Node.js Engine
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Security & Dependencies
        run: npm install

      - name: Execute Quad-Brain Master Script
        env:
          # Securely injects keys without exposing them to the public
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node quad-brain-auditor.mjs

      - name: Lock Ledger and Push to Vercel
        run: |
          git config --global user.name "Nexus Automation Bot"
          git config --global user.email "bot@albsnexus.com"
          git add app/inventory.ts public/google-merchant-feed.json
          git commit -m "chore(auto): quad-brain automated inventory & pricing sync" || echo "No changes to commit"
          git push
