name: ALBS AI General - 3-Shift Banking Ledger & Market Crucible (7AM, 3PM, 10PM CT)
on:
  schedule:
    # 7:00 AM CDT (12:00 UTC), 3:00 PM CDT (20:00 UTC), and 10:00 PM CDT (03:00 UTC)
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  three_shift_executive_close:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ALBS Nexus Matrix
        uses: actions/checkout@v4
      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        run: npm install
      - name: Run AI General 3-Shift Storefront & Banking Telemetry
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          node ai-general-telemetry.mjs
          npm run build
      - name: Commit & Publish Shift Report to Repository
        run: |
          git config user.name "ALBS-AI-General"
          git config user.email "aashorrosh@gmail.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ai-general): 3-shift executive sales & banking report" && git push)
